serviceName: user_service
development: true
database:
  readDb:
    connectionString: postgresql://dev:dev@127.0.0.1:5432/dev_db?sslmode=disable
    dbType: postgres
    migrationFilePath: migrations
    maxIdleConns: 100
    maxOpenConns: 200
    connMaxLifetime: 5
  writeDb:
    connectionString: postgresql://dev:dev@127.0.0.1:5432/dev_db?sslmode=disable
    dbType: postgres
    migrationFilePath: migrations
    maxIdleConns: 100
    maxOpenConns: 200
    connMaxLifetime: 5
http:
  port: :5001
  development: true
  shutdownTimeout: 15
  resources: ["pkg/lang/en.json",	"pkg/lang/fr.json",	"pkg/lang/vi.json"]
  allowOrigins: [ "http://localhost:8080" ]
grpc:
  port: :6001
  development: true
  maxConnectionIdle: 5
  timeout: 15
  maxConnectionAge: 5
  time: 10
client:
  userService: "localhost:5002"
  commonService: "localhost:5008"
logger:
  level: debug
  devMode: false
  encoder: json
tracing:
  enable: false
  serviceName: order_service
  hostPort: "localhost:4317"
  logSpans: false
kafka:
  dialer:
    username:
    password:
  config:
    brokers: [ "pkc-ldvr1.asia-southeast1.gcp.confluent.cloud:9092" ]
    groupID: order_service_consumer
    initTopics: false
    numWorker: 20
  topics:
    submitOrder:
      topicName: consumer-web.order.submit-order
      numPartitions: 10
      replicationFactor: 1
redis:
  addrs: ["localhost:6379"]
  password: ""
  db: 0
  poolSize: 300
heathcheck:
  interval: 10
  port: :7001
  goroutineThreshold: 1000
metrics:
  prometheusPath: /metrics
  prometheusPort: :8001
kakaomap:
  appRestKey: 
  mobilityApiEndpoint: 
  coord2regioncode: 
  address: 
  priority:
  timeChange:
authenticate:
  clientURI:
s3:
  path:
  reconci:
cronjob:
  disable: false
  dispatchSms: 60
  stat: "0"
  FILELOC5: ""
slackservice:
  channel:
  username:
  urlSlackWebhook:
email:
  enabled: false
  provider: smtp
  from: "vucongthanh92@gmail.com"
  verifyUrl: "https://localhost:3000/verify-email"
  smtp:
    host: "smtp.gmail.com"
    port: 587
    username: "vucongthanh92@gmail.com"
    password: ""
loki:
  url: http://localhost:3100/loki/api/v1/push
  env: local
  service: user-service
  batchSize: 20
  flushMs: 1000
  maxQueue: 1000
  retry: 3
  timeoutMs: 2000
oauth:
  google:
    client_id: ${OAUTH_GOOGLE_CLIENT_ID}
    client_secret: ${OAUTH_GOOGLE_CLIENT_SECRET}
    redirect_uri: "http://localhost:5001/api/v1/auth/identity/google/callback"
  github:
    client_id: ${OAUTH_GITHUB_CLIENT_ID}
    client_secret: ${OAUTH_GITHUB_CLIENT_SECRET}
    api_base: "https://api.github.com"
