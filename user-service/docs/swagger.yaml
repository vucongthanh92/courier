definitions:
  entities.User:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      id:
        type: integer
      phone_number:
        type: string
      phone_verified:
        type: boolean
      status:
        type: string
      updated_at:
        type: string
    type: object
  httpcommon.SuccessResponse-array_models_SearchUserResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/models.SearchUserResponse'
        type: array
      errors:
        items:
          $ref: '#/definitions/models.ErrorDTO'
        type: array
      success:
        type: boolean
    type: object
  httpcommon.SuccessResponse-string:
    properties:
      data:
        type: string
      errors:
        items:
          $ref: '#/definitions/models.ErrorDTO'
        type: array
      success:
        type: boolean
    type: object
  models.AuthenticatedUserResponse:
    properties:
      avatar_url:
        type: string
      display_name:
        type: string
      id:
        example: "0"
        type: string
    type: object
  models.ErrorDTO:
    properties:
      code:
        type: string
      field:
        type: string
      message:
        type: string
    type: object
  models.GeneratePasswordRequest:
    properties:
      password:
        type: string
      user_id:
        type: integer
    required:
    - password
    type: object
  models.JwtTokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      need_password_setup:
        type: boolean
      refresh_expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
      user:
        $ref: '#/definitions/models.AuthenticatedUserResponse'
    type: object
  models.LogoutResponse:
    properties:
      message:
        type: string
    type: object
  models.OAuthCallbackRequest:
    properties:
      code:
        type: string
      redirect_uri:
        type: string
      state:
        type: string
    required:
    - code
    type: object
  models.OAuthLoginRequest:
    properties:
      redirect_uri:
        description: for future PKCE/exchange
        type: string
      token:
        description: Google id_token or GitHub access_token
        type: string
    required:
    - token
    type: object
  models.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
      user_id:
        type: integer
    required:
    - refresh_token
    - user_id
    type: object
  models.RenewTokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
    type: object
  models.ResendVerifyEmailRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  models.ResendVerifyEmailResponse:
    properties:
      message:
        type: string
    type: object
  models.SearchUserResponse:
    properties:
      avatar:
        type: string
      display_name:
        type: string
      email:
        type: string
      phone_number:
        type: string
      user_id:
        example: "0"
        type: string
    type: object
  models.SignupRequest:
    properties:
      display_name:
        type: string
      email:
        type: string
      password:
        type: string
      phone_number:
        type: string
    required:
    - display_name
    - email
    - password
    - phone_number
    type: object
  models.VerifyEmailRequest:
    properties:
      email:
        type: string
      token:
        type: string
    required:
    - email
    - token
    type: object
  models.VerifyEmailResponse:
    properties:
      message:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/v1/auth/3rd/{provider}:
    post:
      parameters:
      - description: google or github
        in: path
        name: provider
        required: true
        type: string
      - description: OAuth token
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/models.OAuthLoginRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.JwtTokenResponse'
      summary: OAuth login/signup via provider
      tags:
      - Auth
  /api/v1/auth/3rd/{provider}/callback:
    get:
      parameters:
      - description: github
        in: path
        name: provider
        required: true
        type: string
      - description: code from GitHub
        in: query
        name: code
        required: true
        type: string
      - description: csrf state
        in: query
        name: state
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.OAuthCallbackRequest'
      summary: OAuth callback (GitHub code flow)
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      responses: {}
  /api/v1/auth/logout:
    post:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.LogoutResponse'
      security:
      - BearerAuth: []
  /api/v1/auth/sign-up:
    post:
      consumes:
      - application/json
      parameters:
      - description: SignupRequest
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/models.SignupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entities.User'
      summary: create new user
      tags:
      - Auth
  /api/v1/auth/token/refresh:
    patch:
      parameters:
      - description: RefreshTokenRequest
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/models.RefreshTokenRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RenewTokenResponse'
      security:
      - BearerAuth: []
  /api/v1/auth/verify-email:
    post:
      consumes:
      - application/json
      parameters:
      - description: VerifyEmailRequest
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/models.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.VerifyEmailResponse'
      summary: verify user email
      tags:
      - Auth
  /api/v1/auth/verify-email/resend:
    post:
      consumes:
      - application/json
      parameters:
      - description: ResendVerifyEmailRequest
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/models.ResendVerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ResendVerifyEmailResponse'
      summary: resend verification email
      tags:
      - Auth
  /api/v1/user/pwd/generate:
    post:
      consumes:
      - application/json
      parameters:
      - description: GeneratePasswordRequest
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/models.GeneratePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpcommon.SuccessResponse-string'
      summary: Generate password for user
      tags:
      - Credential
  /api/v1/user/search:
    get:
      consumes:
      - application/json
      parameters:
      - description: Search text for display name, phone number, or email
        in: query
        name: search_key
        required: true
        type: string
      - description: Limit, default 10 and max 20
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpcommon.SuccessResponse-array_models_SearchUserResponse'
      security:
      - BearerAuth: []
      summary: search verified users
      tags:
      - User
swagger: "2.0"
