definitions:
  entities.User:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      id:
        type: integer
      phone_number:
        type: string
      phone_verified:
        type: boolean
      status:
        type: string
      updated_at:
        type: string
    type: object
  models.LogoutResponse:
    properties:
      message:
        type: string
    type: object
  models.OAuthLoginRequest:
    properties:
      redirect_uri:
        description: for future PKCE/exchange
        type: string
      token:
        description: Google id_token or GitHub access_token
        type: string
    required:
    - token
    type: object
  models.OAuthLoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      need_password_setup:
        type: boolean
      refresh_expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  models.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
      user_id:
        type: integer
    required:
    - refresh_token
    - user_id
    type: object
  models.RefreshTokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  models.ResendVerifyEmailRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  models.ResendVerifyEmailResponse:
    properties:
      message:
        type: string
    type: object
  models.SignupRequest:
    properties:
      display_name:
        type: string
      email:
        type: string
      password:
        type: string
      phone_number:
        type: string
    required:
    - display_name
    - email
    - password
    - phone_number
    type: object
  models.VerifyEmailRequest:
    properties:
      email:
        type: string
      token:
        type: string
    required:
    - email
    - token
    type: object
  models.VerifyEmailResponse:
    properties:
      message:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/v1/auth/3rd/{provider}:
    post:
      parameters:
      - description: google or github
        in: path
        name: provider
        required: true
        type: string
      - description: OAuth token
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/models.OAuthLoginRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.OAuthLoginResponse'
      summary: OAuth login/signup via provider
      tags:
      - Auth
  /api/v1/auth/3rd/{provider}/callback:
    get:
      parameters:
      - description: github
        in: path
        name: provider
        required: true
        type: string
      - description: code from GitHub
        in: query
        name: code
        required: true
        type: string
      - description: csrf state
        in: query
        name: state
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.OAuthLoginResponse'
      summary: OAuth callback (GitHub code flow)
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      responses: {}
  /api/v1/auth/logout:
    post:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.LogoutResponse'
      security:
      - BearerAuth: []
  /api/v1/auth/sign-up:
    post:
      consumes:
      - application/json
      parameters:
      - description: SignupRequest
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/models.SignupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entities.User'
      summary: create new user
      tags:
      - Auth
  /api/v1/auth/token/refresh:
    patch:
      parameters:
      - description: RefreshTokenRequest
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/models.RefreshTokenRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RefreshTokenResponse'
      security:
      - BearerAuth: []
  /api/v1/auth/verify-email:
    post:
      consumes:
      - application/json
      parameters:
      - description: VerifyEmailRequest
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/models.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.VerifyEmailResponse'
      summary: verify user email
      tags:
      - Auth
  /api/v1/auth/verify-email/resend:
    post:
      consumes:
      - application/json
      parameters:
      - description: ResendVerifyEmailRequest
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/models.ResendVerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ResendVerifyEmailResponse'
      summary: resend verification email
      tags:
      - Auth
swagger: "2.0"
