apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-ksops-cmp
  namespace: argocd
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: ksops
    spec:
      discover:
        find:
          command:
            - /usr/local/bin/kustomize
            - build
            - --enable-alpha-plugins
            - --enable-exec
            - .
      generate:
        command:
          - /usr/local/bin/kustomize
          - build
          - --enable-alpha-plugins
          - --enable-exec
          - .
