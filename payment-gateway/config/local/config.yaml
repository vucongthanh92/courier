serviceName: payment-gateway
development: true
database:
  readDb:
    connectionString: postgresql://dev:dev@127.0.0.1:5432/dev_db?sslmode=disable
    dbType: postgres
    migrationFilePath: ../shared/migrations
    maxIdleConns: 100
    maxOpenConns: 200
    connMaxLifetime: 5
  writeDb:
    connectionString: postgresql://dev:dev@127.0.0.1:5432/dev_db?sslmode=disable
    dbType: postgres
    migrationFilePath: ../shared/migrations
    maxIdleConns: 100
    maxOpenConns: 200
    connMaxLifetime: 5
http:
  port: :5003
  development: true
  shutdownTimeout: 15
  resources: []
  allowOrigins: [ "http://localhost:8080" ]
healthcheck:
  port: ":5103"
  interval: 10
grpc:
  port: :6003
  development: true
  maxConnectionIdle: 5
  timeout: 15
  maxConnectionAge: 5
  time: 10
client:
  userService: "localhost:6001"
logger:
  level: debug
  devMode: false
  encoder: json
tracing:
  enable: false
  serviceName: payment-gateway
  hostPort: "localhost:4317"
  logSpans: false
redis:
  addrs: ["localhost:6379"]
  password: ""
  db: 3
  poolSize: 100
kafka:
  brokers: ["localhost:9092"]
  groupID: payment-gateway
  topics:
    chatEvents: courier.chat.events.v1
cronjob:
  disable: true
loki:
  url: http://localhost:3100/loki/api/v1/push
  env: local
  service: payment-gateway
  batchSize: 20
  flushMs: 1000
  maxQueue: 1000
  retry: 3
  timeoutMs: 2000
sepay:
  environment: sandbox
  merchantId: "${PAYMENT_GATEWAY_SEPAY_MERCHANT_ID}"
  secretKey: "${PAYMENT_GATEWAY_SEPAY_SECRET_KEY}"
  checkoutUrl: "https://pay-sandbox.sepay.vn/v1/checkout/init"
  successUrl: "http://localhost:8080/payment/success"
  errorUrl: "http://localhost:8080/payment/error"
  cancelUrl: "http://localhost:8080/payment/cancel"
  webhookSecret: "${PAYMENT_GATEWAY_SEPAY_WEBHOOK_SECRET}"
  receivingAccountNumbers: ["0000000001"]
  timestampToleranceSec: 300
