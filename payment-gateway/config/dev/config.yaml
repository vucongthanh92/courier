serviceName: payment-gateway
development: true
http:
  port: ":5003"
  shutdownTimeout: 15
  allowOrigins: [ "http://localhost:8080", "http://localhost:8081" ]
healthcheck:
  port: ":5103"
database:
  readDb:
    connectionString: "${PAYMENT_GATEWAY_DATABASE_CONNECTION_STRING}"
    dbType: postgres
    migrationFilePath: ../shared/migrations
    maxIdleConns: 100
    maxOpenConns: 200
    connMaxLifetime: 5
  writeDb:
    connectionString: "${PAYMENT_GATEWAY_DATABASE_CONNECTION_STRING}"
    dbType: postgres
    migrationFilePath: ../shared/migrations
    maxIdleConns: 100
    maxOpenConns: 200
    connMaxLifetime: 5
sepay:
  environment: sandbox
  merchantId: "${PAYMENT_GATEWAY_SEPAY_MERCHANT_ID}"
  secretKey: "${PAYMENT_GATEWAY_SEPAY_SECRET_KEY}"
  checkoutUrl: "${PAYMENT_GATEWAY_SEPAY_CHECKOUT_URL}"
  successUrl: "${PAYMENT_GATEWAY_SEPAY_SUCCESS_URL}"
  errorUrl: "${PAYMENT_GATEWAY_SEPAY_ERROR_URL}"
  cancelUrl: "${PAYMENT_GATEWAY_SEPAY_CANCEL_URL}"
  webhookSecret: "${PAYMENT_GATEWAY_SEPAY_WEBHOOK_SECRET}"
  receivingAccountNumbers: ["${PAYMENT_GATEWAY_SEPAY_RECEIVING_ACCOUNT_NUMBER}"]
  timestampToleranceSec: 300
