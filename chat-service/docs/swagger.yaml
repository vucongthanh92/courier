info:
  contact: {}
  description: Conversation and messaging APIs for Courier.
  title: Courier Chat Service API
  version: "1.0"
paths:
  /api/v1/conversation/{id}/members:
    get:
      consumes:
      - application/json
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpcommon.SuccessResponse-models_ListConversationMembersResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpcommon.SuccessResponse-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpcommon.SuccessResponse-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpcommon.SuccessResponse-any'
      security:
      - BearerAuth: []
      summary: list members for a conversation with resolved user profiles
      tags:
      - Conversation
  /api/v1/conversation/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: CreateConversationRequest
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/models.CreateConversationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CreateConversationResponse'
      summary: create new conversation
      tags:
      - Conversation
  /api/v1/conversations:
    get:
      consumes:
      - application/json
      parameters:
      - description: Limit, default 20 and max 100
        in: query
        name: limit
        type: integer
      - description: Cursor activity timestamp
        in: query
        name: before_last_message_at
        type: string
      - description: Cursor conversation ID
        in: query
        name: before_conversation_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpcommon.SuccessResponse-models_ListConversationsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpcommon.SuccessResponse-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpcommon.SuccessResponse-any'
      security:
      - BearerAuth: []
      summary: list conversations for authenticated user
      tags:
      - Conversation
  /api/v1/conversations/{id}/messages:
    get:
      consumes:
      - application/json
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: integer
      - description: Limit, default 20 and max 100
        in: query
        name: limit
        type: integer
      - description: Fetch messages older than this message ID
        in: query
        name: before_message_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpcommon.SuccessResponse-models_ListMessagesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpcommon.SuccessResponse-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpcommon.SuccessResponse-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpcommon.SuccessResponse-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpcommon.SuccessResponse-any'
      security:
      - BearerAuth: []
      summary: list messages in a conversation
      tags:
      - Message
  /api/v1/conversations/{id}/messages/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: integer
      - description: SendMessageRequest
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/models.SendMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpcommon.SuccessResponse-models_MessageResponse'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httpcommon.SuccessResponse-models_MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpcommon.SuccessResponse-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpcommon.SuccessResponse-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpcommon.SuccessResponse-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpcommon.SuccessResponse-any'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpcommon.SuccessResponse-any'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpcommon.SuccessResponse-any'
      security:
      - BearerAuth: []
      summary: create a text message in a conversation
      tags:
      - Message
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
