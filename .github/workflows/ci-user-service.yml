name: ci-user-service

on:
  push:
    branches:
      - main
    paths:
      - "user-service/**"
      - "k8s/**"
      - "argocd/**"
      - ".github/workflows/ci-user-service.yml"
  pull_request:
    branches:
      - main
    paths:
      - "user-service/**"
      - "k8s/**"
      - "argocd/**"
      - ".github/workflows/ci-user-service.yml"

env:
  IMAGE_NAME: ghcr.io/vucongthanh92/courier/user-service

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: user-service/go.mod
          cache-dependency-path: user-service/go.sum
      - name: Test
        run: go test ./...

  build-image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: user-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build image
        run: |
          docker build \
            -t "${IMAGE_NAME}:${{ steps.meta.outputs.tag }}" \
            -t "${IMAGE_NAME}:latest" \
            .
      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push "${IMAGE_NAME}:${{ steps.meta.outputs.tag }}"
          docker push "${IMAGE_NAME}:latest"
