apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-dns-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vucongthanh92/courier.git
    targetRevision: main
    path: k8s/overlays/dev/cluster-dns
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
