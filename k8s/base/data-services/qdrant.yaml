apiVersion: v1
kind: Service
metadata:
  name: qdrant
spec:
  ports:
    - name: http
      port: 6333
      targetPort: 6333
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: qdrant-data-node
  labels:
    kubernetes.io/service-name: qdrant
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 6333
endpoints:
  - addresses:
      - 10.42.0.114
    conditions:
      ready: true
