apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: ghcr.io/vucongthanh92/courier/user-service:dev
          imagePullPolicy: IfNotPresent
          command: ["/app/user-service"]
          args: ["start", "--config=/app/config/dev/config.yaml"]
          envFrom:
            - configMapRef:
                name: user-service-config
          ports:
            - name: http
              containerPort: 5001
            - name: grpc
              containerPort: 6001
            - name: health
              containerPort: 7001
            - name: metrics
              containerPort: 8001
          volumeMounts:
            - name: config
              mountPath: /app/config/dev/config.yaml
              subPath: config.yaml
              readOnly: true
          startupProbe:
            httpGet:
              path: /live
              port: health
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          secret:
            secretName: user-service-config
