services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: courier-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: courier-kafka-init
    depends_on:
      - kafka
    environment:
      BOOTSTRAP_SERVER: kafka:29092
      TOPICS_FILE: /etc/kafka/topics.json
    volumes:
      - ./topics.json:/etc/kafka/topics.json:ro
      - ./scripts/create-topics.sh:/usr/local/bin/create-topics.sh:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        bash /usr/local/bin/create-topics.sh

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: courier-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: courier-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
